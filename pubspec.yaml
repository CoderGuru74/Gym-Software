name: muscle_gym_software
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.2
  tflite_flutter: ^0.11.0
  image: ^4.1.3
  image_picker: ^1.0.7
  intl: ^0.19.0
  google_fonts: ^6.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/muscle.jpeg"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/muscle.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/models/mobile_facenet.tflite
    - assets/images/gym_bg.jpg
    - assets/images/muscle.jpeg